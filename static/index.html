<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Network for Carbon Markets (ONCM) Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
/* Palette taken from the CDPG / IIMB logo: brand red, light red, greys, on white. */
tailwind.config = { theme: { extend: {
  colors: {
    brand: { 50: '#FFF7F7', 100: '#FBEAEA', 400: '#C96060', 600: '#B5242A', 700: '#8E1A1F' },
    mist: { DEFAULT: '#F5F5F5' }
  },
  fontFamily: { display: ['"Bricolage Grotesque"', 'sans-serif'], sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'] }
} } }
</script>
<style>
  :root{
    --red:#B5242A; --red-dark:#8E1A1F; --red-light:#C96060; --red-tint:#FBEAEA;
    --grey:#808080; --grey-light:#C4C4C4; --line:#E3E3E3; --ink:#262626; --mist:#F5F5F5;
  }
  body{background:#FFFFFF;color:var(--ink)}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}

  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:.5rem;font-weight:600;font-size:.875rem;transition:background .15s,border-color .15s}
  .btn-primary{background:var(--red);color:#fff;border:1px solid var(--red)}
  .btn-primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
  .btn-ghost{border:1px solid var(--grey-light);background:#fff;color:var(--ink)}
  .btn-ghost:hover{background:var(--mist);border-color:var(--grey)}
  .btn-danger{background:#fff;border:1px solid var(--red-light);color:var(--red-dark)}
  .btn-danger:hover{background:var(--red-tint)}

  .field{width:100%;border:1px solid var(--grey-light);border-radius:.5rem;padding:.5rem .7rem;background:#fff;font-size:.9rem}
  .field:focus{border-color:var(--red)}
  label.l{display:block;font-size:.8rem;font-weight:600;margin:.7rem 0 .25rem;color:#404040}

  table.t{width:100%;font-size:.875rem;border-collapse:collapse}
  table.t th{text-align:left;font-weight:600;color:#404040;padding:.55rem .75rem;border-bottom:2px solid var(--red);white-space:nowrap}
  table.t td{padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}

  .badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}

  /* onboarding rail */
  .rail{display:flex;align-items:flex-start;gap:0}
  .rail .node{flex:1;position:relative;text-align:center;font-size:.8rem;font-weight:600;padding-top:2.1rem;color:var(--grey)}
  .rail .node::before{content:"";position:absolute;top:.55rem;left:0;right:0;height:4px;background:var(--grey-light)}
  .rail .node::after{content:"";position:absolute;top:0;left:calc(50% - .8rem);width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;border:4px solid var(--grey-light)}
  .rail .node.done{color:var(--ink)}
  .rail .node.done::before{background:var(--red)}
  .rail .node.done::after{background:var(--red);border-color:var(--red)}
  .rail .node.now{color:var(--red-dark)}
  .rail .node.now::after{background:#fff;border-color:var(--red)}
  .rail .node:first-child::before{left:50%}
  .rail .node:last-child::before{right:50%}

  dialog{border:0;border-radius:.9rem;padding:0;max-width:44rem;width:94vw;box-shadow:0 20px 60px rgba(38,38,38,.3)}
  dialog::backdrop{background:rgba(38,38,38,.5)}

  /* iOS zooms into inputs below 16px: keep every field at 16px on phones */
  @media (max-width:640px){.field{font-size:16px}}

  /* ---- Request to join form (mobile first) ---- */
  .jf-page{min-height:100vh;background:var(--mist);padding-bottom:env(safe-area-inset-bottom)}
  .jf-top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .jf-top-in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem}
  .jf-logo{height:2.1rem;width:auto;display:block}
  .jf-count{margin-left:auto;font-size:.75rem;color:#525252;text-align:right}
  .jf-signin{font-size:.8rem;font-weight:600;color:var(--red);text-decoration:underline;white-space:nowrap}
  .jf-bar{height:4px;background:var(--line)}
  .jf-bar i{display:block;height:100%;width:0;background:var(--red);transition:width .12s linear}
  .jf-nav{max-width:46rem;margin:0 auto;display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .jf-nav::-webkit-scrollbar{display:none}
  .jf-nav a{flex:none;font-size:.8rem;font-weight:600;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--grey-light);color:#404040;background:#fff;white-space:nowrap}
  .jf-nav a.on{background:var(--red-tint);border-color:var(--red);color:var(--red-dark)}
  .jf-main{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 3rem}
  .jf-intro h1,.jf-done h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.75rem;line-height:1.15}
  .jf-sub{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:1.1rem;color:var(--red-dark);margin-top:.35rem}
  .jf-note{font-size:.875rem;color:#525252;margin-top:.6rem;max-width:36rem}
  .jf-sheet{background:#fff;border:1px solid var(--line);border-radius:.9rem;margin-top:1.1rem;padding:0 1rem}
  .jf-done{padding:1.5rem 1.25rem}
  .jf-sec{padding:1.25rem 0 .5rem;scroll-margin-top:7.5rem}
  .jf-sec+.jf-sec{border-top:1px solid var(--line)}
  .jf-st{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.2rem;border-left:4px solid var(--red);padding-left:.6rem}
  .jf-ss{font-size:.85rem;color:#525252;margin:.4rem 0 0 .85rem}
  .jf-q{border:0;margin:0;padding:1rem 0;min-width:0;display:block}
  .jf-q.bad .field{border-color:#B91C1C}
  .jf-l{display:flex;gap:.55rem;font-size:.9rem;font-weight:600;color:#262626;margin-bottom:.45rem;padding:0;line-height:1.35}
  .jf-n{flex:none;min-width:1.4rem;color:var(--red);font-variant-numeric:tabular-nums}
  .jf-body{padding-left:1.95rem}
  .jf-opt{font-style:normal;font-weight:500;font-size:.75rem;color:#737373;margin-left:.25rem}
  .jf-h{font-size:.8rem;color:#525252;margin-top:.4rem}
  .jf-err{font-size:.8rem;font-weight:600;color:#B91C1C;margin-top:.4rem}
  .jf-wc{font-size:.8rem;color:#525252;margin-top:.35rem;text-align:right}
  .jf-wc.over{color:#B91C1C;font-weight:700}
  .jf-chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .jf-chip{position:relative;display:block}
  .jf-chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .jf-chip span{display:flex;align-items:center;min-height:2.75rem;padding:.4rem .85rem;border:1px solid var(--grey-light);border-radius:.6rem;background:#fff;font-size:.875rem;line-height:1.2;transition:background .12s,border-color .12s}
  .jf-chip:hover span{border-color:var(--grey)}
  .jf-chip input:checked+span{background:var(--red-tint);border-color:var(--red);color:var(--red-dark);font-weight:600}
  .jf-chip input[type=checkbox]:checked+span::before{content:"\2713";margin-right:.4rem;font-weight:700}
  .jf-chip input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
  .jf-submit{padding:1.25rem 0 1.5rem;border-top:1px solid var(--line)}
  .jf-submit .btn{width:100%;justify-content:center;padding:.8rem 1rem;font-size:1rem}
  .jf-submit .btn:disabled{opacity:.6}
  .jf-small{font-size:.75rem;color:#737373;margin-top:.6rem;text-align:center}
  @media (max-width:420px){.jf-body{padding-left:0}.jf-count{font-size:.7rem}.jf-chip{flex:1 1 calc(50% - .25rem)}.jf-chip span{justify-content:center;text-align:center}}
  @media (min-width:640px){.jf-main{padding-top:2rem}.jf-sheet{padding:0 2rem}.jf-intro h1,.jf-done h1{font-size:2.1rem}.jf-submit .btn{width:auto;min-width:14rem}.jf-small{text-align:left}.jf-sec{scroll-margin-top:8rem}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body class="font-sans min-h-screen">
<div id="app"></div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
<script src="/app.js"></script>
</body>
</html>
